openapi: 3.1.0
info:
  title: INDUX Backend MVP API
  version: 0.1.0
  description: >
    Local-first REST API for the INDUX hackathon MVP. Industrial integrations are
    read-only. The API stores telemetry, exposes incidents and reports backend
    status. WebSocket events are described in the project PRD because OpenAPI
    does not define standard WebSocket operations.
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local demo server
tags:
  - name: System
  - name: Assets
  - name: Telemetry
  - name: Incidents
paths:
  /health:
    get:
      tags: [System]
      summary: API process health
      operationId: getHealth
      responses:
        "200":
          description: API process is responding
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok
  /system/status:
    get:
      tags: [System]
      summary: Backend component status
      operationId: getSystemStatus
      responses:
        "200":
          description: Component status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
  /assets:
    get:
      tags: [Assets]
      summary: List assets
      operationId: listAssets
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
  /assets/{asset_id}:
    get:
      tags: [Assets]
      summary: Get one asset
      operationId: getAsset
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          $ref: "#/components/responses/NotFound"
  /assets/{asset_id}/sensors:
    get:
      tags: [Assets]
      summary: List sensors for an asset
      operationId: listAssetSensors
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Sensors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorList"
        "404":
          $ref: "#/components/responses/NotFound"
  /telemetry/ingest:
    post:
      tags: [Telemetry]
      summary: Ingest a telemetry batch
      operationId: ingestTelemetry
      description: >
        Request envelope errors reject the whole request. Individual reading
        errors are reported per item; valid readings are persisted. Maximum
        batch size is 500 readings. Duplicate readings are rejected individually.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryBatch"
      responses:
        "200":
          description: Batch processed, possibly with rejected readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "422":
          description: Invalid request envelope or batch exceeds maximum size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /telemetry/latest:
    get:
      tags: [Telemetry]
      summary: Get latest telemetry readings
      operationId: getLatestTelemetry
      parameters:
        - name: asset_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Latest readings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TelemetryReading"
  /telemetry/history:
    get:
      tags: [Telemetry]
      summary: Query telemetry history for an asset
      operationId: getTelemetryHistory
      parameters:
        - name: asset_id
          in: query
          required: true
          schema:
            type: string
        - name: start
          in: query
          required: true
          description: Inclusive ISO 8601 UTC timestamp
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          description: Exclusive ISO 8601 UTC timestamp; must be later than start
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Ordered telemetry history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryList"
        "400":
          description: Invalid time range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /incidents:
    get:
      tags: [Incidents]
      summary: List incidents
      operationId: listIncidents
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/IncidentStatus"
        - name: asset_id
          in: query
          required: false
          schema:
            type: string
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Severity"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Incidents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
  /incidents/{incident_id}:
    get:
      tags: [Incidents]
      summary: Get incident details
      operationId: getIncident
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          $ref: "#/components/responses/NotFound"
  /incidents/{incident_id}/acknowledge:
    post:
      tags: [Incidents]
      summary: Acknowledge an open incident
      operationId: acknowledgeIncident
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Incident acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Incident is already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /incidents/{incident_id}/resolve:
    post:
      tags: [Incidents]
      summary: Resolve an active incident
      operationId: resolveIncident
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: Incident resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Incident is already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  parameters:
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailable:
      description: Required backend component unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              examples: [NOT_FOUND]
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
    SystemStatus:
      type: object
      required: [status, database, ingestion, detector, llm, last_telemetry_at]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unavailable]
        database:
          type: string
          enum: [ready, unavailable]
        ingestion:
          type: string
          enum: [ready, stopped, error]
        detector:
          type: string
          enum: [ready, unavailable, not_configured]
        llm:
          type: string
          enum: [ready, unavailable, disabled, not_configured]
        last_telemetry_at:
          type: [string, "null"]
          format: date-time
    Asset:
      type: object
      required: [id, name, asset_type, status, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        asset_type:
          type: string
        location:
          type: [string, "null"]
        status:
          type: string
          enum: [normal, warning, critical, unknown]
        last_seen_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    AssetList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Sensor:
      type: object
      required: [id, asset_id, name, unit]
      properties:
        id:
          type: string
        asset_id:
          type: string
        name:
          type: string
        unit:
          type: string
        sensor_type:
          type: [string, "null"]
    SensorList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Sensor"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    TelemetryReadingInput:
      type: object
      required: [asset_id, sensor_id, value, unit, timestamp]
      properties:
        asset_id:
          type: string
        sensor_id:
          type: string
        value:
          type: number
        unit:
          type: string
        timestamp:
          type: string
          format: date-time
    TelemetryBatch:
      type: object
      required: [source_id, readings]
      properties:
        source_id:
          type: string
        readings:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/TelemetryReadingInput"
    TelemetryReading:
      allOf:
        - $ref: "#/components/schemas/TelemetryReadingInput"
        - type: object
          required: [id, source_id, received_at]
          properties:
            id:
              type: integer
            source_id:
              type: string
            received_at:
              type: string
              format: date-time
    ReadingResult:
      type: object
      required: [index, status]
      properties:
        index:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [accepted, rejected]
        code:
          type: string
        message:
          type: string
        reading_id:
          type: integer
    IngestResult:
      type: object
      required: [accepted, rejected, results]
      properties:
        accepted:
          type: integer
        rejected:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReadingResult"
    TelemetryList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TelemetryReading"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    IncidentStatus:
      type: string
      enum: [open, acknowledged, resolved]
    Severity:
      type: string
      enum: [low, medium, high, critical]
    Incident:
      type: object
      required:
        - id
        - asset_id
        - anomaly_category
        - title
        - severity
        - status
        - created_at
        - last_observed_at
        - updated_at
        - occurrence_count
      properties:
        id:
          type: string
        asset_id:
          type: string
        anomaly_category:
          type: string
        title:
          type: string
        description:
          type: [string, "null"]
        severity:
          $ref: "#/components/schemas/Severity"
        status:
          $ref: "#/components/schemas/IncidentStatus"
        created_at:
          type: string
          format: date-time
        last_observed_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        acknowledged_at:
          type: [string, "null"]
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        resolution_note:
          type: [string, "null"]
        occurrence_count:
          type: integer
          minimum: 1
        latest_evidence:
          type: object
          additionalProperties: true
    IncidentList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
