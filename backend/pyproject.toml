[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "indux-backend"
version = "0.1.0"
description = "Local INDUX telemetry and incident API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119,<1", "uvicorn>=0.37,<1", "websockets>=15,<17",
    "pydantic>=2.9,<3", "anyio>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "PyYAML>=6,<7", "jsonschema>=4.23,<5", "ruff>=0.14,<1"]

[project.scripts]
indux-backend = "indux.__main__:main"
indux-simulate = "indux.simulator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
indux = ["storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = ".ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
